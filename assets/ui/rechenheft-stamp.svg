<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 50" width="140" height="50" aria-label="Rechenheft Stempel">
  <defs>
    <filter id="stampRough">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" />
    </filter>
  </defs>
  <g filter="url(#stampRough)" transform="rotate(-3 70 25)" opacity="0.82">
    <!-- Outer dashed stamp border -->
    <rect x="4" y="4" width="132" height="42" rx="8" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="8,3" />
    <rect x="7" y="7" width="126" height="36" rx="6" fill="#f0f9ff" fill-opacity="0.4" stroke="#0284c7" stroke-width="1" />
    <!-- Text -->
    <text x="24" y="24" font-family="'Andika', system-ui, sans-serif" font-size="11" font-weight="900" fill="#0369a1" letter-spacing="1">RECHENHEFT</text>
    <text x="24" y="36" font-family="'Andika', system-ui, sans-serif" font-size="9" font-weight="700" fill="#0284c7">Klasse 1 &amp; 2 ★</text>
    <!-- Stamp Icon -->
    <text x="108" y="32" font-size="18" fill="#0284c7">📐</text>
  </g>
</svg>
