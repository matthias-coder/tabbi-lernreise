<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <filter id="tripDrop" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f766e" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Signpost Behind -->
  <g transform="translate(136, 36)" filter="url(#tripDrop)">
    <!-- Wooden Pole -->
    <rect x="36" y="20" width="14" height="170" rx="3" fill="#a16207" stroke="#713f12" stroke-width="2" />
    <!-- Sign 1 pointing right -->
    <path d="M 10,40 L 74,40 L 92,54 L 74,68 L 10,68 Z" fill="#facc15" stroke="#ca8a04" stroke-width="3" />
    <circle cx="24" cy="54" r="5" fill="#78350f" />
    <!-- Sign 2 pointing left -->
    <path d="M 50,84 L -8,84 L -26,98 L -8,112 L 50,112 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="3" />
    <circle cx="36" cy="98" r="5" fill="#0369a1" />
  </g>

  <!-- Adventure Backpack -->
  <g transform="translate(36, 76)" filter="url(#tripDrop)">
    <!-- Main Body -->
    <rect x="20" y="32" width="100" height="120" rx="28" fill="#0d9488" stroke="#115e59" stroke-width="6" />
    <!-- Front Pocket -->
    <rect x="36" y="78" width="68" height="58" rx="16" fill="#14b8a6" stroke="#115e59" stroke-width="4" />
    <!-- Flap top -->
    <path d="M 16,56 Q 70,74 124,56 L 124,32 Q 70,18 16,32 Z" fill="#f59e0b" stroke="#b45309" stroke-width="4" />
    <!-- Buckle -->
    <circle cx="70" cy="100" r="7" fill="#fef08a" stroke="#b45309" stroke-width="2.5" />
    <!-- Top Carry Handle -->
    <path d="M 44,28 Q 70,8 96,28" stroke="#f59e0b" stroke-width="7" stroke-linecap="round" fill="none" />
  </g>
</svg>