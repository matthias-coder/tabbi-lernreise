<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 50" width="140" height="50" aria-label="Schreibheft Stempel Rot">
  <defs>
    <filter id="stampRoughDeutsch">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" />
    </filter>
  </defs>
  <g filter="url(#stampRoughDeutsch)" transform="rotate(2 70 25)" opacity="0.88">
    <!-- Outer dashed stamp border in school red -->
    <rect x="4" y="4" width="132" height="42" rx="8" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7,3" />
    <rect x="7" y="7" width="126" height="36" rx="6" fill="#fef2f2" fill-opacity="0.5" stroke="#dc2626" stroke-width="1" />
    <!-- Text -->
    <text x="22" y="24" font-family="'Andika', system-ui, sans-serif" font-size="11" font-weight="900" fill="#b91c1c" letter-spacing="1">SCHREIBHEFT</text>
    <text x="22" y="36" font-family="'Andika', system-ui, sans-serif" font-size="9" font-weight="700" fill="#dc2626">Fibel-Worte ★</text>
    <!-- Stamp Icon -->
    <text x="108" y="32" font-size="18" fill="#b91c1c">✒️</text>
  </g>
</svg>
