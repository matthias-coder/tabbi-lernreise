<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="talerGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="talerRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <filter id="talerDrop" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#78350f" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Coin Edge & Rim -->
  <circle cx="128" cy="132" r="104" fill="url(#talerRim)" />
  <circle cx="128" cy="128" r="104" fill="url(#talerGold)" filter="url(#talerDrop)" />
  <circle cx="128" cy="128" r="88" fill="none" stroke="#ca8a04" stroke-width="6" stroke-dasharray="14 10" />
  <circle cx="128" cy="128" r="76" fill="url(#talerGold)" stroke="#eab308" stroke-width="4" />

  <!-- Embossed Star in center -->
  <polygon points="128,68 142,106 182,108 150,132 162,172 128,148 94,172 106,132 74,108 114,106" fill="#fef9c3" stroke="#b45309" stroke-width="4" stroke-linejoin="round" />
  <circle cx="128" cy="128" r="14" fill="#facc15" stroke="#b45309" stroke-width="2" />
</svg>