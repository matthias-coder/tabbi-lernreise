<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <filter id="bookDrop" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#312e81" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Magic Sparkles -->
  <polygon points="50,40 54,52 66,56 54,60 50,72 46,60 34,56 46,52" fill="#facc15" />
  <polygon points="206,50 209,60 219,63 209,66 206,76 203,66 193,63 203,60" fill="#facc15" />
  <polygon points="128,26 131,36 141,39 131,42 128,52 125,42 115,39 125,36" fill="#fef08a" />

  <!-- Open Magic Storybook -->
  <g transform="translate(28, 70)" filter="url(#bookDrop)">
    <!-- Book cover back -->
    <path d="M 6,36 Q 52,18 100,36 Q 148,18 194,36 L 194,142 Q 148,124 100,142 Q 52,124 6,142 Z" fill="#6366f1" stroke="#3730a3" stroke-width="6" />
    <!-- White pages -->
    <path d="M 14,44 Q 54,28 98,44 L 98,136 Q 54,120 14,136 Z" fill="#ffffff" stroke="#e0e7ff" stroke-width="3" />
    <path d="M 102,44 Q 146,28 186,44 L 186,136 Q 146,120 102,136 Z" fill="#ffffff" stroke="#e0e7ff" stroke-width="3" />
    <!-- Bookmark ribbon -->
    <path d="M 100,36 L 100,154 L 110,144 L 120,154 L 120,36 Z" fill="#ef4444" />
    <!-- Story illustrations on pages -->
    <circle cx="56" cy="74" r="14" fill="#fde047" stroke="#ca8a04" stroke-width="2" />
    <path d="M 42,106 Q 56,92 70,106" stroke="#2563eb" stroke-width="4" fill="none" stroke-linecap="round" />
    <line x1="30" y1="120" x2="82" y2="120" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <!-- Magic wand on right page -->
    <path d="M 130,116 L 166,62" stroke="#8b5cf6" stroke-width="6" stroke-linecap="round" />
    <polygon points="166,54 169,64 179,64 171,70 174,80 166,74 158,80 161,70 153,64 163,64" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />
  </g>
</svg>