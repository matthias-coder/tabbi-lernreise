<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <filter id="playDrop" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#831843" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Big Game Dice -->
  <g transform="translate(36, 96)" filter="url(#playDrop)">
    <rect x="0" y="0" width="108" height="108" rx="26" fill="#ec4899" stroke="#9d174d" stroke-width="6" />
    <circle cx="28" cy="28" r="9" fill="#ffffff" />
    <circle cx="80" cy="80" r="9" fill="#ffffff" />
    <circle cx="54" cy="54" r="9" fill="#ffffff" />
    <circle cx="28" cy="80" r="9" fill="#ffffff" />
    <circle cx="80" cy="28" r="9" fill="#ffffff" />
  </g>

  <!-- Wooden Board Game Pawn / Meeple -->
  <g transform="translate(136, 44)" filter="url(#playDrop)">
    <!-- Head -->
    <circle cx="48" cy="36" r="26" fill="#f59e0b" stroke="#78350f" stroke-width="6" />
    <!-- Collar & Body -->
    <path d="M 28,68 C 28,52 38,48 48,48 C 58,48 68,52 68,68 L 78,140 C 78,152 70,158 48,158 C 26,158 18,152 18,140 Z" fill="#f59e0b" stroke="#78350f" stroke-width="6" />
    <ellipse cx="48" cy="144" rx="28" ry="12" fill="#d97706" />
  </g>
</svg>