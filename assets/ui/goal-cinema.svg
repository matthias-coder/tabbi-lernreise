<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <filter id="popDrop" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#7c2d12" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Cinema Ticket behind -->
  <g transform="translate(136, 128) rotate(-16)" filter="url(#popDrop)">
    <rect x="0" y="0" width="96" height="54" rx="8" fill="#f59e0b" stroke="#78350f" stroke-width="3" />
    <circle cx="0" cy="27" r="10" fill="#ffffff" stroke="#78350f" stroke-width="2" />
    <circle cx="96" cy="27" r="10" fill="#ffffff" stroke="#78350f" stroke-width="2" />
    <line x1="28" y1="0" x2="28" y2="54" stroke="#78350f" stroke-width="2" stroke-dasharray="4 4" />
    <text x="60" y="34" font-family="'Andika', system-ui, sans-serif" font-size="16" font-weight="900" fill="#78350f" text-anchor="middle">KINO</text>
  </g>

  <!-- Popcorn Bucket -->
  <g transform="translate(48, 64)" filter="url(#popDrop)">
    <!-- Popcorn flakes top -->
    <circle cx="36" cy="36" r="22" fill="#fef08a" stroke="#ca8a04" stroke-width="3" />
    <circle cx="76" cy="24" r="26" fill="#fef08a" stroke="#ca8a04" stroke-width="3" />
    <circle cx="116" cy="36" r="22" fill="#fef08a" stroke="#ca8a04" stroke-width="3" />
    <circle cx="56" cy="42" r="20" fill="#fef9c3" />
    <circle cx="96" cy="42" r="20" fill="#fef9c3" />

    <!-- Striped Bucket -->
    <path d="M 20,54 L 38,154 L 114,154 L 132,54 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="5" />
    <!-- White Stripes -->
    <path d="M 40,54 L 52,154 L 68,154 L 60,54 Z" fill="#ffffff" />
    <path d="M 76,54 L 80,154 L 96,154 L 96,54 Z" fill="#ffffff" />
  </g>
</svg>