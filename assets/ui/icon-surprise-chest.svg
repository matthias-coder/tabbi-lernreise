<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="chestWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a16207" />
      <stop offset="100%" stop-color="#713f12" />
    </linearGradient>
    <linearGradient id="chestGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="chestDrop" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#3b0764" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Sparkles -->
  <polygon points="40,60 44,72 56,76 44,80 40,92 36,80 24,76 36,72" fill="#facc15" />
  <polygon points="216,70 219,80 229,83 219,86 216,96 213,86 203,83 213,80" fill="#facc15" />
  <polygon points="128,24 132,36 144,40 132,44 128,56 124,44 112,40 124,36" fill="#fef08a" />

  <!-- Chest Body -->
  <g filter="url(#chestDrop)">
    <!-- Base box -->
    <rect x="38" y="118" width="180" height="92" rx="14" fill="url(#chestWood)" stroke="#451a03" stroke-width="5" />
    <!-- Lid -->
    <path d="M 34,118 C 34,70 76,58 128,58 C 180,58 222,70 222,118 Z" fill="url(#chestWood)" stroke="#451a03" stroke-width="5" />

    <!-- Gold bands -->
    <rect x="66" y="62" width="22" height="148" rx="4" fill="url(#chestGold)" stroke="#78350f" stroke-width="3" />
    <rect x="168" y="62" width="22" height="148" rx="4" fill="url(#chestGold)" stroke="#78350f" stroke-width="3" />

    <!-- Horizontal rim -->
    <rect x="32" y="112" width="192" height="16" rx="5" fill="url(#chestGold)" stroke="#78350f" stroke-width="3" />

    <!-- Keyhole plate -->
    <circle cx="128" cy="136" r="22" fill="url(#chestGold)" stroke="#78350f" stroke-width="3" />
    <circle cx="128" cy="132" r="5" fill="#451a03" />
    <polygon points="126,132 130,132 132,146 124,146" fill="#451a03" />
  </g>
</svg>