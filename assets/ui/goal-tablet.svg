<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <filter id="tabDrop" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1e3a8a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Tablet Case -->
  <g transform="translate(32, 28)" filter="url(#tabDrop)">
    <rect x="0" y="0" width="192" height="200" rx="28" fill="#3b82f6" stroke="#1d4ed8" stroke-width="6" />
    <circle cx="96" cy="12" r="4" fill="#1e3a8a" />
    <circle cx="96" cy="188" r="8" fill="#1d4ed8" stroke="#60a5fa" stroke-width="2" />
    
    <!-- Screen -->
    <rect x="16" y="24" width="160" height="152" rx="14" fill="#0f172a" />
    <rect x="20" y="28" width="152" height="144" rx="10" fill="#38bdf8" />

    <!-- Big Play Game Star -->
    <polygon points="96,56 107,88 141,90 114,110 124,142 96,122 68,142 78,110 51,90 85,88" fill="#facc15" stroke="#ca8a04" stroke-width="4" stroke-linejoin="round" />
    <circle cx="96" cy="104" r="12" fill="#fef08a" />
  </g>
</svg>